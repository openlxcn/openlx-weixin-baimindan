<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="100%" height="100%" fill="#f4f0e4"/><path d="M50 100H1550" stroke="#b7a373"/><text x="55" y="68" font-family="PingFang SC,Noto Sans CJK SC,sans-serif" font-size="26" font-weight="700" fill="#154d42">OPENLX</text><text x="1270" y="66" font-family="PingFang SC,Noto Sans CJK SC,sans-serif" font-size="18" font-weight="400" fill="#152d2a">0.1 测试版 · Pre-release</text><text x="60" y="180" font-family="PingFang SC,Noto Sans CJK SC,sans-serif" font-size="46" font-weight="600" fill="#154d42">把变动留在用户侧，把调用交给固定网关</text><text x="60" y="265" font-family="PingFang SC,Noto Sans CJK SC,sans-serif" font-size="27" font-weight="400" fill="#b04131">传统方式</text><text x="60" y="337" font-family="PingFang SC,Noto Sans CJK SC,sans-serif" font-size="42" font-weight="400" fill="#152d2a">换网络 → IP变化 → 调用失败</text><text x="60" y="407" font-family="PingFang SC,Noto Sans CJK SC,sans-serif" font-size="42" font-weight="400" fill="#152d2a">登录后台 → 修改白名单 → 重试</text><rect x="55" y="478" width="1490" height="230" rx="14" fill="#174e43"/><text x="85" y="534" font-family="PingFang SC,Noto Sans CJK SC,sans-serif" font-size="28" font-weight="400" fill="#e5ce9d">OpenLX</text><text x="85" y="610" font-family="PingFang SC,Noto Sans CJK SC,sans-serif" font-size="38" font-weight="400" fill="#fffdf5">安装Skill → 扫码授权一次 → 固定网关执行 → 返回结果</text><text x="85" y="665" font-family="PingFang SC,Noto Sans CJK SC,sans-serif" font-size="25" font-weight="400" fill="#fffdf5">Skill只负责交接；写作、排版与图片继续使用你熟悉的能力。</text><path d="M50 830H1550" stroke="#b7a373"/><text x="55" y="866" font-family="PingFang SC,Noto Sans CJK SC,sans-serif" font-size="17" font-weight="400" fill="#152d2a">wx.openlx.cn   /   中国文旅信源中心</text><text x="1180" y="866" font-family="PingFang SC,Noto Sans CJK SC,sans-serif" font-size="16" font-weight="400" fill="#152d2a">首次仍需扫码授权 · 微信规则依然适用</text></svg>