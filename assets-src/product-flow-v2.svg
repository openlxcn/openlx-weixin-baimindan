<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="720"><rect width="100%" height="100%" fill="#f4f0e4"/><text x="60" y="63" font-family="PingFang SC,sans-serif" font-size="22" font-weight="600" fill="#174e43">OPENLX  /  WHY WE BUILT IT</text><path d="M60 92h1480" stroke="#b7a373"/><text x="60" y="165" font-family="PingFang SC,sans-serif" font-size="46" font-weight="600" fill="#174e43">白名单不应成为每次换网络后的重复工作</text><text x="60" y="214" font-family="PingFang SC,sans-serif" font-size="26" font-weight="400" fill="#52645c">让用户侧自由移动，让公众号调用通过长期在线网关执行。</text><rect x="60" y="265" width="710" height="335" rx="20" fill="#fffdf5" stroke="#c7c7b5"/><text x="90" y="310" font-family="PingFang SC,sans-serif" font-size="20" font-weight="600" fill="#9b603c">直接从变化的客户端调用</text><text x="90" y="365" font-family="PingFang SC,sans-serif" font-size="32" font-weight="600" fill="#174e43">网络改变，调用出口随之改变</text><text x="90" y="420" font-family="PingFang SC,sans-serif" font-size="23" font-weight="400" fill="#52645c">切换 Wi-Fi / 更换电脑 / 服务器 IP 变化</text><text x="90" y="459" font-family="PingFang SC,sans-serif" font-size="23" font-weight="400" fill="#52645c">遇到白名单校验失败</text><text x="90" y="498" font-family="PingFang SC,sans-serif" font-size="23" font-weight="400" fill="#52645c">登录公众号后台维护，再回来重试</text><rect x="810" y="265" width="730" height="335" rx="20" fill="#174e43" stroke="#c7c7b5"/><text x="840" y="310" font-family="PingFang SC,sans-serif" font-size="20" font-weight="600" fill="#daca9f">使用 OpenLX</text><text x="840" y="365" font-family="PingFang SC,sans-serif" font-size="32" font-weight="600" fill="#fffdf5">安装 Skill → 扫码授权 → 网关执行</text><text x="840" y="420" font-family="PingFang SC,sans-serif" font-size="23" font-weight="400" fill="#f4f0e4">客户端把已准备的请求交给 OpenLX</text><text x="840" y="459" font-family="PingFang SC,sans-serif" font-size="23" font-weight="400" fill="#f4f0e4">网关处理公众号接口调用</text><text x="840" y="498" font-family="PingFang SC,sans-serif" font-size="23" font-weight="400" fill="#f4f0e4">返回原草稿或发布任务的真实结果</text><path d="M60 655h1480" stroke="#b7a373"/><text x="60" y="692" font-family="PingFang SC,sans-serif" font-size="20" font-weight="400" fill="#174e43">wx.openlx.cn  /  微信公众号发布免登录白名单 Skill</text><text x="1140" y="692" font-family="PingFang SC,sans-serif" font-size="20" font-weight="400" fill="#174e43">v0.1.1 beta · 首次需扫码授权</text></svg>