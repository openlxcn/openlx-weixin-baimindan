="400" fill="#fffdf5">03   已接收准备好的发布请求</text><text x="980" y="526" font-family="PingFang SC,Noto Sans CJK SC,sans-serif" font-size="27" font-weight="400" fill="#fffdf5">04   已创建草稿</text><text x="980" y="603" font-family="PingFang SC,Noto Sans CJK SC,sans-serif" font-size="27" font-weight="400" fill="#fffdf5">05   已返回执行结果</text><path d="M50 830H1550" stroke="#b7a373"/><text x="55" y="866" font-family="PingFang SC,Noto Sans CJK SC,sans-serif" font-size="17" font-weight="400" fill="#152d2a">wx.openlx.cn   /   中国文旅信源中心</text><text x="1180" y="866" font-family="PingFang SC,Noto Sans CJK SC,sans-serif" font-size="16" font-weight="400" fill="#152d2a">首次仍需扫码授权 · 微信规则依然适用</text></svg>