<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="100%" height="100%" fill="#f4f0e4"/><path d="M50 100H1550" stroke="#b7a373"/><text x="55" y="68" font-family="PingFang SC,Noto Sans CJK SC,sans-serif" font-size="26" font-weight="700" fill="#154d42">OPENLX</text><text x="1270" y="66" font-family="PingFang SC,Noto Sans CJK SC,sans-serif" font-size="18" font-weight="400" fill="#152d2a">0.1 测试版 · Pre-release</text><text x="60" y="205" font-family="PingFang SC,Noto Sans CJK SC,sans-serif" font-size="56" font-weight="600" fill="#154d42">三步，让智能体连接公众号</text><text x="60" y="265" font-family="PingFang SC,Noto Sans CJK SC,sans-serif" font-size="30" font-weight="400" fill="#152d2a">已有内容，直接交接。</text><rect x="60" y="345" width="450" height="300" rx="12" fill="#fffdf5" stroke="#c4cbbc"/><text x="85" y="387" font-family="PingFang SC,Noto Sans CJK SC,sans-serif" font-size="20" font-weight="400" fill="#b04131">01 / INSTALL</text><text x="85" y="440" font-family="PingFang SC,Noto Sans CJK SC,sans-serif" font-size="30" font-weight="600" fill="#154d42">安装Skill</text><text x="85" y="482" font-family="PingFang SC,Noto Sans CJK SC,sans-serif" font-size="18" font-weight="400" fill="#152d2a">选择你的智能体和操作系统</text><rect x="575" y="345" width="450" height="300" rx="12" fill="#fffdf5" stroke="#c4cbbc"/><text x="600" y="387" font-family="PingFang SC,Noto Sans CJK SC,sans-serif" font-size="20" font-weight="400" fill="#b04131">02 / AUTHORIZE</text><text x="600" y="440" font-family="PingFang SC,Noto Sans CJK SC,sans-serif" font-size="30" font-weight="600" fill="#154d42">扫码授权</text><text x="600" y="482" font-family="PingFang SC,Noto Sans CJK SC,sans-serif" font-size="18" font-weight="400" fill="#152d2a">在现有OpenLX用户中心完成</text><rect x="1090" y="345" width="450" height="300" rx="12" fill="#fffdf5" stroke="#c4cbbc"/><text x="1115" y="387" font-family="PingFang SC,Noto Sans CJK SC,sans-serif" font-size="20" font-weight="400" fill="#b04131">03 / HANDOFF</text><text x="1115" y="440" font-family="PingFang SC,Noto Sans CJK SC,sans-serif" font-size="30" font-weight="600" fill="#154d42">通过OpenLX网关提交</text><text x="1115" y="482" font-family="PingFang SC,Noto Sans CJK SC,sans-serif" font-size="18" font-weight="400" fill="#152d2a">指定公众号与动作，核对返回状态</text><text x="63" y="720" font-family="PingFang SC,Noto Sans CJK SC,sans-serif" font-size="26" font-weight="400" fill="#152d2a">创建草稿与公开发布分别执行，公开发布须有用户明确指令。</text><path d="M50 830H1550" stroke="#b7a373"/><text x="55" y="866" font-family="PingFang SC,Noto Sans CJK SC,sans-serif" font-size="17" font-weight="400" fill="#152d2a">wx.openlx.cn   /   中国文旅信源中心</text><text x="1180" y="866" font-family="PingFang SC,Noto Sans CJK SC,sans-serif" font-size="16" font-weight="400" fill="#152d2a">首次仍需扫码授权 · 微信规则依然适用</text></svg>